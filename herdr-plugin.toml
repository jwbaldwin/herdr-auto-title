id = "herdr-auto-title"
name = "Herdr Auto Title"
version = "0.2.0"
min_herdr_version = "0.7.5"
description = "Show status on managed tabs and use OpenCode titles until manually renamed"
platforms = ["linux", "macos"]

[[build]]
command = ["cargo", "build", "--release", "--locked"]

[[startup]]
command = ["./target/release/herdr-auto-title"]

[[events]]
on = "pane.agent_status_changed"
command = ["./target/release/herdr-auto-title"]

[[events]]
on = "tab.created"
command = ["./target/release/herdr-auto-title"]

[[events]]
on = "tab.closed"
command = ["./target/release/herdr-auto-title"]

[[events]]
on = "tab.focused"
command = ["./target/release/herdr-auto-title"]

[[events]]
on = "tab.renamed"
command = ["./target/release/herdr-auto-title"]

[[events]]
on = "pane.moved"
command = ["./target/release/herdr-auto-title"]

[[events]]
on = "pane.closed"
command = ["./target/release/herdr-auto-title"]

[[events]]
on = "workspace.closed"
command = ["./target/release/herdr-auto-title"]
