[package]
name = "herdr-auto-title"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Keep Herdr tabs synced with OpenCode titles until manually renamed"
license = "MIT"

[dependencies]
fs2 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wait-timeout = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
